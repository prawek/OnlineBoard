<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Онлайн-доска с палитрой Miro</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #2f3542;
            --grid-color: rgba(0, 0, 0, 0.1);
            --panel-bg: #ffffff;
            --panel-shadow: rgba(0, 0, 0, 0.1);
        }
        [data-theme="dark"] {
            --bg-color: #1e272e;
            --text-color: #d2dae2;
            --grid-color: rgba(255, 255, 255, 0.1);
            --panel-bg: #2f3542;
            --panel-shadow: rgba(0, 0, 0, 0.5);
        }

        body { margin: 0; overflow: hidden; background-color: var(--bg-color); color: var(--text-color); font-family: sans-serif; }
        canvas { display: block; cursor: crosshair; }

        #bg-grid {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: -1;
            background-image:
                linear-gradient(to right, var(--grid-color) 1px, transparent 1px),
                linear-gradient(to bottom, var(--grid-color) 1px, transparent 1px);
            background-size: 30px 30px; display: none;
        }
        .grid-enabled #bg-grid { display: block; }

        #toolbar {
            position: absolute; top: 20px; left: 20px; background: var(--panel-bg);
            padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px var(--panel-shadow);
            display: flex; gap: 20px; align-items: center; z-index: 10;
        }

        .tool-group { display: flex; flex-direction: column; font-size: 12px; gap: 6px; }

        .color-palette { display: flex; gap: 6px; align-items: center; }

        .color-swatch {
            width: 24px; height: 24px; border-radius: 50%; cursor: pointer;
            border: 2px solid transparent; transition: transform 0.1s, border-color 0.1s;
        }
        .color-swatch:hover { transform: scale(1.15); }
        .color-swatch.active { border-color: #ff4757; transform: scale(1.1); }

        .color-picker-wrapper {
            position: relative; width: 24px; height: 24px; border-radius: 50%;
            overflow: hidden; border: 2px solid #ccc; cursor: pointer;
        }
        .color-picker-wrapper input[type="color"] {
            position: absolute; top: -5px; left: -5px; width: 34px; height: 34px; border: none; cursor: pointer;
        }

        button, label.btn-upload, select {
            padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px;
        }
        .btn-action { background-color: #ff4757; color: white; }
        .btn-action:hover { background-color: #ff6b81; }
        input[type="file"] { display: none; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>
<body class="grid-enabled">

    <div id="bg-grid"></div>

    <div id="toolbar">
        <div class="tool-group">
            <label>Инструмент:</label>
            <select id="toolSelect">
                <option value="brush">Кисть</option>
                <option value="text">Текст</option>
            </select>
        </div>

        <div class="tool-group">
            <label>Цвет:</label>
            <div class="color-palette">
                <div class="color-swatch active" style="background-color: #2f3542;" data-color="#2f3542"></div>
                <div class="color-swatch" style="background-color: #ff4757;" data-color="#ff4757"></div>
                <div class="color-swatch" style="background-color: #1e90ff;" data-color="#1e90ff"></div>
                <div class="color-swatch" style="background-color: #2ed573;" data-color="#2ed573"></div>
                <div class="color-swatch" style="background-color: #ffa502;" data-color="#ffa502"></div>
                <div class="color-picker-wrapper" title="Свой цвет">
                    <input type="color" id="customColorPicker" value="#70a1ff">
                </div>
            </div>
        </div>

        <div class="tool-group">
            <label>Толщина / Размер:</label>
            <input type="range" id="sizeSlider" min="1" max="50" value="3">
        </div>

        <label class="btn-action btn-upload">
            Картинка
            <input type="file" id="imageUpload" accept="image/*">
        </label>
        <button id="clearBtn" class="btn-action">Очистить</button>
    </div>

    <canvas id="whiteboard" oncontextmenu="return false;"></canvas>

    <script>
        const socket = io();
        const canvas = document.getElementById('whiteboard');
        const context = canvas.getContext('2d');
        const bgGrid = document.getElementById('bg-grid');

        const toolSelect = document.getElementById('toolSelect');
        const sizeSlider = document.getElementById('sizeSlider');
        const imageUpload = document.getElementById('imageUpload');
        const clearBtn = document.getElementById('clearBtn');
        const customColorPicker = document.getElementById('customColorPicker');
        const swatches = document.querySelectorAll('.color-swatch');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let currentColor = '#2f3542';

        let elements = [];
        let scale = 1;
        let offsetX = 0;
        let offsetY = 0;
        let isDrawing = false;
        let currentLine = null;
        let isPanning = false;
        let startPanX = 0;
        let startPanY = 0;
        const imageCache = {};

        swatches.forEach(swatch => {
            swatch.addEventListener('click', (e) => {
                document.querySelector('.color-swatch.active')?.classList.remove('active');
                e.target.classList.add('active');

                currentColor = e.target.getAttribute('data-color');
            });
        });

        customColorPicker.addEventListener('input', (e) => {
            document.querySelector('.color-swatch.active')?.classList.remove('active');
            currentColor = e.target.value;
        });


        function redraw() {
            context.setTransform(1, 0, 0, 1, 0, 0);
            context.clearRect(0, 0, canvas.width, canvas.height);

            bgGrid.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
            bgGrid.style.transformOrigin = "0 0";

            context.setTransform(scale, 0, 0, scale, offsetX, offsetY);

            elements.forEach(el => {
                if (el.type === 'line') {
                    context.beginPath();
                    context.moveTo(el.points[0].x, el.points[0].y);
                    for (let i = 1; i < el.points.length; i++) {
                        context.lineTo(el.points[i].x, el.points[i].y);
                    }
                    context.strokeStyle = el.color;
                    context.lineWidth = el.width;
                    context.lineCap = 'round';
                    context.lineJoin = 'round';
                    context.stroke();
                }
                else if (el.type === 'text') {
                    context.font = `${el.size}px sans-serif`;
                    context.fillStyle = el.color;
                    context.fillText(el.text, el.x, el.y);
                }
                else if (el.type === 'image') {
                    if (imageCache[el.id]) {
                        context.drawImage(imageCache[el.id], el.x, el.y, el.width, el.height);
                    } else {
                        const img = new Image();
                        img.onload = () => { imageCache[el.id] = img; redraw(); };
                        img.src = el.src;
                    }
                }
            });
        }

        function getWorldCoords(e) {
            return { x: (e.clientX - offsetX) / scale, y: (e.clientY - offsetY) / scale };
        }

        canvas.addEventListener('mousedown', (e) => {
            if (e.button === 2) {
                isPanning = true;
                startPanX = e.clientX - offsetX;
                startPanY = e.clientY - offsetY;
                canvas.style.cursor = 'grab';
                return;
            }

            if (e.button === 0) {
                const worldPos = getWorldCoords(e);

                if (toolSelect.value === 'brush') {
                    isDrawing = true;
                    currentLine = {
                        type: 'line',
                        color: currentColor,
                        width: parseInt(sizeSlider.value),
                        points: [{x: worldPos.x, y: worldPos.y}]
                    };
                    elements.push(currentLine);
                }
                else if (toolSelect.value === 'text') {
                    const text = prompt("Введите текст:");
                    if (text) {
                        const newText = {
                            type: 'text',
                            text: text,
                            x: worldPos.x,
                            y: worldPos.y,
                            color: currentColor,
                            size: parseInt(sizeSlider.value) * 5
                        };
                        elements.push(newText);
                        socket.emit('draw_element', newText);
                        redraw();
                    }
                }
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isPanning) {
                offsetX = e.clientX - startPanX;
                offsetY = e.clientY - startPanY;
                redraw();
            }
            else if (isDrawing && currentLine) {
                const worldPos = getWorldCoords(e);
                currentLine.points.push({x: worldPos.x, y: worldPos.y});
                redraw();
            }
        });

        canvas.addEventListener('mouseup', (e) => {
            if (e.button === 2) { isPanning = false; canvas.style.cursor = 'crosshair'; }
            if (e.button === 0 && isDrawing) {
                isDrawing = false;
                socket.emit('draw_element', currentLine);
                currentLine = null;
            }
        });

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomDirection = e.deltaY < 0 ? 1.1 : 0.9;
            const mouseX = e.clientX; const mouseY = e.clientY;
            offsetX = mouseX - (mouseX - offsetX) * zoomDirection;
            offsetY = mouseY - (mouseY - offsetY) * zoomDirection;
            scale *= zoomDirection;
            scale = Math.min(Math.max(0.1, scale), 10);
            redraw();
        }, { passive: false });

        imageUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const center = getWorldCoords({clientX: canvas.width / 2, clientY: canvas.height / 2});
                    const newImage = {
                        type: 'image', id: Date.now().toString(), src: event.target.result,
                        x: center.x - (img.width / 2), y: center.y - (img.height / 2),
                        width: img.width, height: img.height
                    };
                    elements.push(newImage);
                    socket.emit('draw_element', newImage);
                    redraw();
                }
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
            e.target.value = '';
        });

        socket.on('init_board', (serverElements) => { elements = serverElements; redraw(); });
        socket.on('draw_element', (data) => { elements.push(data); redraw(); });
        clearBtn.addEventListener('click', () => { socket.emit('clear_canvas'); });
        socket.on('clear_canvas', () => { elements = []; redraw(); });
        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; redraw(); });

        redraw();
    </script>
</body>
</html>
